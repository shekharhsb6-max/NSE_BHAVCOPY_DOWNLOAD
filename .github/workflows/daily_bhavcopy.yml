
name: NSE Daily Bhavcopy

on:
  schedule:
    # GitHub cron uses UTC; IST = UTC + 5 hours 30 minutes.
    # Attempt 1: 9:17 PM IST
    - cron: "47 15 * * 1-5"

    # Attempt 2: 9:47 PM IST
    - cron: "17 16 * * 1-5"

    # Attempt 3: 10:47 PM IST
    - cron: "17 17 * * 1-5"

  workflow_dispatch:

# Prevent concurrent runs from writing to Google Sheets.
# GitHub retains one running and at most one pending run per group.
concurrency:
  group: nse-daily-bhavcopy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  daily:
    name: Download and Update Bhavcopy
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Google Sheet secrets
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GOOGLE_SPREADSHEET_ID" ]; then
            echo "::error::GOOGLE_SPREADSHEET_ID is empty."
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::GOOGLE_SERVICE_ACCOUNT_JSON is empty."
            exit 1
          fi

          echo "Google Sheets credentials are available."

      - name: Resolve intended NSE trading date
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          target = now.date()

          # Weekend runs and runs before noon IST refer to
          # the previous weekday's trading session.
          if now.weekday() >= 5 or now.hour < 12:
              target -= timedelta(days=1)

              while target.weekday() >= 5:
                  target -= timedelta(days=1)

          target_text = target.isoformat()

          print(f"Current IST time : {now.isoformat()}")
          print(f"BHAVCOPY_DATE    : {target_text}")

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:
              env_file.write(f"BHAVCOPY_DATE={target_text}\n")
          PY

      - name: Run NSE Daily Bhavcopy
        env:
          MODE: DAILY
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting NSE Daily Bhavcopy download."
          echo "Target trade date: ${BHAVCOPY_DATE}"

          python fetch_bhavcopy.py
