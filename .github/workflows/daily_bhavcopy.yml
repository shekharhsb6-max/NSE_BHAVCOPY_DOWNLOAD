name: Daily NSE Bhavcopy → Google Sheet

on:
  schedule:
    # 13:30 UTC = 19:00 IST, Monday-Friday
    - cron: "30 13 * * 1-5"

  workflow_dispatch:
    inputs:
      bhavcopy_date:
        description: "Optional date to fetch (YYYY-MM-DD). Leave blank for today."
        required: false
        default: ""

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run fetch script
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          SHEET_NAME: RAW_DATA
          BHAVCOPY_MODE: append
          BHAVCOPY_DATE: ${{ inputs.bhavcopy_date }}
        run: python fetch_bhavcopy.py
