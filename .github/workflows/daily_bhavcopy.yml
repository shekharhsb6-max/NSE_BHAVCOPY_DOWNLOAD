name: NSE Daily Bhavcopy

on:
  schedule:
    # Primary: 20:47 IST (15:17 UTC). Use a non-round minute to reduce
    # GitHub Actions schedule congestion.
    - cron: "47 15 * * 1-5"

    # Backup: 21:47 IST (16:17 UTC).
    # The DAILY loader is idempotent for an existing trade date, so a
    # second scheduled attempt is safe if the primary schedule is missed.
    - cron: "17 16 * * 1-5"

  workflow_dispatch:

jobs:
  daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Google Sheet secrets
        env:
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SPREADSHEET_ID" ]; then
            echo "ERROR: GOOGLE_SPREADSHEET_ID is EMPTY"
            exit 1
          fi

          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_SERVICE_ACCOUNT_JSON is EMPTY"
            exit 1
          fi

          echo "Google Sheet credentials are available."

      - name: Resolve intended NSE trading date
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          import os

          now = datetime.now(ZoneInfo("Asia/Kolkata"))
          target = now.date()

          # GitHub scheduled workflows can be delayed. If the scheduled run
          # spills past midnight into a weekend, keep it tied to the Friday
          # session rather than accidentally requesting Saturday.
          # Likewise, a delayed weekday run before noon is treated as the
          # previous weekday session.
          if now.weekday() >= 5 or (now.weekday() > 0 and now.hour < 12):
              target -= timedelta(days=1)
              while target.weekday() >= 5:
                  target -= timedelta(days=1)

          target_text = target.isoformat()
          print(f"Current IST time : {now.isoformat()}")
          print(f"BHAVCOPY_DATE    : {target_text}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"BHAVCOPY_DATE={target_text}\n")
          PY

      - name: Run NSE Daily Bhavcopy
        env:
          MODE: DAILY
          GOOGLE_SPREADSHEET_ID: ${{ secrets.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          BHAVCOPY_DATE: ${{ env.BHAVCOPY_DATE }}
        run: |
          python fetch_bhavcopy.py
